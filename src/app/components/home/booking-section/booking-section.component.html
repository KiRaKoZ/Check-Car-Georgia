<div class="max-w-[1430px] mx-auto px-4 py-16">
  <div class="grid lg:grid-cols-2 gap-10 items-center">
    <div class="space-y-6">
      <span class="text-sm text-secondary font-medium">{{ translations()?.booking?.sectionEyebrow }}</span>
      <h2 class="text-3xl md:text-4xl font-bold text-primary dark:text-white leading-tight">{{ translations()?.booking?.title }}</h2>
      <p class="text-base text-gray-600 dark:text-gray-300 max-w-[500px]">{{ translations()?.booking?.subtitle }}</p>
      <a routerLink="/booking-page" class="inline-flex items-center gap-2 bg-secondary text-white px-6 py-3 rounded-xl font-medium transition duration-300 hover:opacity-90 hover:scale-[1.02]">
        {{ translations()?.booking?.bookNow }}
        <span class="material-symbols-outlined text-[18px]">arrow_forward</span>
      </a>
    </div>

    <div class="grid gap-4 sm:grid-cols-2">
      <div *ngFor="let step of translations()?.booking?.steps || []" class="p-5 rounded-2xl border border-gray-200 dark:border-gray-700 hover:shadow-md hover:-translate-y-1 transition duration-300">
        <span class="material-symbols-outlined text-primary text-[28px] dark:text-white">{{ step.icon }}</span>
        <h3 class="mt-3 font-semibold text-primary dark:text-white text-base">{{ step.title }}</h3>
        <p class="text-sm text-gray-500 dark:text-gray-400 mt-1">{{ step.text }}</p>
      </div>
    </div>
  </div>
</div>
