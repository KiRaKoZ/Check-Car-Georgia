<section class="mx-auto max-w-[1430px] px-4 py-4">
  <div class=" w-full ">
    <h2
      class="text-3xl font-bold leading-tight text-primary dark:text-white md:text-4xl"
    >
      Select a Body Style
    </h2>

    <p
      class="mt-4 text-sm leading-7 text-slate-600 dark:text-slate-300 md:text-base"
    >
      Explore our collection by vehicle category and quickly find the style that
      fits your comfort, needs and budget.
    </p>
  </div>

  <div class="relative mt-12 overflow-hidden rounded-[32px] bg-slate-50 px-4 py-8 dark:bg-[#111827] md:px-6">
    <div class="pointer-events-none absolute inset-y-0 left-0 z-10 w-16 bg-gradient-to-r from-slate-50 to-transparent dark:from-[#111827]"></div>
    <div class="pointer-events-none absolute inset-y-0 right-0 z-10 w-16 bg-gradient-to-l from-slate-50 to-transparent dark:from-[#111827]"></div>

    <div class="slider-wrapper overflow-hidden">
      <div class="slider-track flex items-stretch whitespace-nowrap animate-scroll gap-2 md:gap-4">
        <ng-container *ngFor="let style of duplicatedStyles">
          <a
            [routerLink]="['/cars']"
            [queryParams]="{ type: style.value }"
            class="inline-block w-[220px] shrink-0"
          >
            <article
              class="group flex h-full flex-col items-center rounded-[28px]  bg-white px-5 py-6 text-center shadow-sm transition-all duration-300 hover:-translate-y-1 hover:border-secondary/30 hover:shadow-[0_16px_40px_rgba(15,23,42,0.08)] dark:border-white/10 dark:bg-[#0f172a]"
            >
              <div
                class="flex h-[150px] w-full items-center justify-center overflow-hidden rounded-[22px] bg-slate-100 dark:bg-white/5"
              >
                <img
                  [src]="style.image"
                  [alt]="style.altText"
                  class="h-[120px] w-auto object-contain transition-transform duration-300 group-hover:scale-105"
                />
              </div>

              <div class="mt-5">
                <h3 class="text-lg font-semibold text-primary dark:text-white">
                  {{ style.name }}
                </h3>

                <p class="mt-2 text-sm text-slate-500 dark:text-slate-400">
                  View available {{ style.name | lowercase }} cars
                </p>
              </div>
            </article>
          </a>
        </ng-container>
      </div>
    </div>
  </div>
</section>
