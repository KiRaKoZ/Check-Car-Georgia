<div class="px-5 py-0 mx-auto my-0 max-w-[1430px]  ">
  <h2 class="mb-20 text-4xl font-bold leading-10 text-center text-primary max-md:mb-10 max-md:text-3xl max-sm:mb-8 max-sm:text-2xl">
    Select a Body Style
  </h2>
  <div class="relative">
    <div #slider class="overflow-hidden">
      <div class="flex transition-transform duration-300 ease-in-out">
        <div *ngFor="let style of bodyStyles" class="flex-shrink-0 w-[200px] mx-5">
          <div class="flex flex-col items-center w-full transition-transform duration-300 ease-in-out hover:scale-105">
            <img [src]="style.image" [alt]="style.altText" class="object-contain h-[150px] w-[200px] max-sm:w-full max-sm:h-auto" />
            <div class="mt-2.5 text-lg leading-8 text-primary max-sm:text-base">{{ style.name }}</div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
