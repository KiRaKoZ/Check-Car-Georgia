<section class="relative overflow-hidden max-w-[1800px] mx-auto bg-bg-2 dark:bg-[#252F73] rounded-lg min-h-[700px] flex items-center max-xl:min-h-[500px] max-md:h-auto max-md:py-[3rem]">
  <div class="flex w-full max-w-[1430px] m-auto">
    <div class="flex flex-col gap-8 justify-center max-w-[50%] w-full pl-[1rem] pr-[8rem] max-xl:pr-[3rem] max-md:max-w-none max-md:px-[1rem] text-primary dark:text-white">
      <div class="flex flex-col gap-6 max-md:gap-[1rem]">
        <h4 class="font-bold leading-[45px] whitespace-nowrap">{{ translations()?.calculator?.title }}</h4>
        <h6>{{ translations()?.calculator?.subtitle }}</h6>
      </div>

      <form class="flex flex-col gap-8 max-md:gap-4">
        <div class="grid grid-cols-2 gap-8 max-md:grid-cols-1">
          <div class="form-group bg-white rounded-xl relative text-primary">
            <label class="absolute top-2 left-4 text-[#818181] text-[13px] font-normal leading-normal">{{ translations()?.booking?.car }}</label>
            <select [(ngModel)]="selectedSlug" name="selectedSlug" class="pt-[25px] px-[15px] pb-[10px] w-full rounded-xl bg-transparent outline-none">
              <option *ngFor="let car of cars" [value]="car.slug">{{ car.fullName || car.name }} • {{ car.year }}</option>
            </select>
          </div>
          <div class="form-group bg-white rounded-xl relative text-primary">
            <label class="absolute top-2 left-4 text-[#818181] text-[13px] font-normal leading-normal">{{ translations()?.calculator?.pricePerDay }}</label>
            <input type="text" [value]="selectedCar?.price || '—'" class="pt-[25px] px-[15px] pb-[10px] w-full rounded-xl bg-transparent" readonly>
          </div>
          <div class="form-group bg-white rounded-xl relative text-primary">
            <label class="absolute top-2 left-4 text-[#818181] text-[13px] font-normal leading-normal">{{ translations()?.calculator?.rentalDays }}</label>
            <input type="number" min="1" [(ngModel)]="rentalDays" name="rentalDays" class="pt-[25px] px-[15px] pb-[10px] w-full rounded-xl bg-transparent outline-none">
          </div>
          <div class="form-group bg-white rounded-xl relative text-primary border-2 border-secondary">
            <label class="absolute top-2 left-4 text-[#818181] text-[13px] font-normal leading-normal">{{ translations()?.calculator?.result }}</label>
            <input type="text" [value]="currencySymbol + total" class="pt-[25px] px-[15px] pb-[10px] w-full rounded-xl bg-transparent font-bold text-secondary" readonly>
          </div>
        </div>
        <a [routerLink]="['/service-page']" [queryParams]="{ car: selectedSlug }" class="w-full p-[1rem] flex justify-center items-center gap-2 rounded-xl border border-secondary bg-secondary text-white">{{ translations()?.calculator?.cta }}</a>
      </form>
    </div>

    <div class="absolute right-0 top-0 h-full w-1/2 max-md:hidden">
      <img src="images/rentCar.jpeg" alt="calculator" loading="lazy" class="h-full w-full object-cover rounded-r-lg">
    </div>
  </div>
</section>
