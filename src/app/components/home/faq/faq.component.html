<section class="mx-auto max-w-[1400px] px-4 py-14 text-primary dark:text-white">
  <div class="mx-auto max-w-4xl text-center">
    <p class="text-sm uppercase tracking-[0.2em] text-secondary">FAQ</p>
    <h2 class="mt-3 text-4xl font-bold">ხშირად დასმული კითხვები</h2>
    <p class="mt-4 opacity-75">მთავარი ინფორმაცია დაჯავშნამდე, ქირაობამდე და ავტომობილის მიღებამდე.</p>
  </div>

  <div class="faq-shell mx-auto mt-10 max-w-5xl">
    <article *ngFor="let item of faqItems; let i = index" class="faq-item" [class.faq-item-open]="item.isOpen">
      <button type="button" class="faq-button" (click)="toggleFaq(i)">
        <span class="faq-number">{{ (i + 1) < 10 ? '0' + (i + 1) : i + 1 }}</span>
        <span class="faq-question">{{ item.question }}</span>
        <span class="faq-icon" [class.faq-icon-open]="item.isOpen">+</span>
      </button>
      <div *ngIf="item.isOpen" @slideInOut class="faq-answer-wrap">
        <div class="faq-answer">{{ item.answer }}</div>
      </div>
    </article>
  </div>
</section>
