<section
  class="gap-16 pl-[calc((100vw-1430px)/2)] relative overflow-hidden px-4"
>
  <div
    class="flex flex-wrap gap-5 items-center justify-between w-full max-w-[1400px] text-primary dark:text-white max-md:max-w-full"
  >
    <div class="flex w-full items-center justify-between gap-4">
      <h2 class="text-3xl font-bold leading-none">Vehicle Details</h2>

    <a
      routerLink="/cars"
      class="flex gap-1 justify-center items-center text-base font-medium leading-loose"
    >
      <span class="self-stretch my-auto max-sm:hidden">{{ translations()?.viewAll }}</span>
      <span class="material-symbols-outlined text-xl leading-none">arrow_outward</span>
    </a>
    </div>

  </div>

  <div class="mt-12 w-full max-w-[1400px] max-md:mt-10 max-md:max-w-full">
    <div class="grid grid-cols-6 gap-5 max-md:grid-cols-1 max-md:gap-x-0">
      <a
        *ngFor="let card of displayCards; let i = index"
        [routerLink]="['/cars']"
        [queryParams]="{ type: card.typeKey }"
        class="w-full"
        [ngClass]="i < 2 ? 'col-span-3' : 'col-span-2'"
      >
        <div
          class="car-tile flex relative overflow-hidden flex-col items-start px-8 pb-8 w-full rounded-3xl h-[20rem] max-md:px-5 min-h-[200px] max-sm:max-h-[200px]"
          [class.is-unavailable]="!card.available"
        >
          <img
            [src]="card.image"
            [alt]="card.label"
            class="absolute inset-0 size-full rounded-3xl object-cover transition-transform duration-500 hover:scale-110"
            [class.dimmed]="!card.available"
          />

          <div
            class="flex absolute bottom-5 gap-2.5 justify-center items-center px-6 py-2 bg-white rounded-[60px] max-md:px-5 text-primary"
          >
            <img
              [src]="card.icon"
              [alt]="card.label + ' icon'"
              class="w-5 h-5 object-contain"
            />
            <span class="self-stretch my-auto">{{ card.label }}</span>
          </div>

          <span *ngIf="!card.available" class="status-badge">
            ხელმიუწვდომელია
          </span>
        </div>
      </a>
    </div>
  </div>
</section>
