<section class="mx-auto max-w-[1280px] px-4 py-16 text-primary dark:text-white">
  <div class="mx-auto max-w-3xl text-center">


    <h1 class="mt-5 text-3xl font-bold leading-tight md:text-5xl">
      {{ translations()?.terms?.title }}
    </h1>

    <p class="mx-auto mt-4 max-w-2xl text-sm leading-7 text-slate-600 dark:text-slate-300 md:text-base">
      {{ translations()?.terms?.subtitle }}
    </p>
  </div>

  <div class="mt-14 grid gap-6 md:grid-cols-2 xl:grid-cols-3">
    <article
 *ngFor="let item of termsCards()"
      class="group rounded-[28px] border border-slate-200 bg-white p-6 shadow-[0_10px_35px_rgba(15,23,42,0.05)] transition-all duration-300 hover:-translate-y-1 hover:shadow-[0_16px_45px_rgba(15,23,42,0.08)] dark:border-white/10 dark:bg-[#111827]"
    >
      <div
        class="flex h-12 w-12 items-center justify-center rounded-2xl bg-secondary/10 text-secondary"
      >
        <span class="material-symbols-outlined text-[22px]">
          {{ item.icon }}
        </span>
      </div>

      <h2 class="mt-5 text-xl font-semibold leading-8">
        {{ item.title }}
      </h2>

      <p class="mt-3 text-sm leading-7 text-slate-600 dark:text-slate-300">
        {{ item.description }}
      </p>
    </article>
  </div>
</section>
